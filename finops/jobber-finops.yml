specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Jobber
providerId: jobber
created: '2026-05-25'
modified: '2026-05-25'
reconciled: true
tags:
  - FinOps
  - Cost Management
  - SaaS
  - FOCUS
description: |
  FOCUS-aligned FinOps definition for Jobber. Jobber's primary billing surface is a flat SaaS
  subscription (Core / Connect / Grow / Plus) with per-additional-user seat charges; Jobber Payments
  layers transaction-percentage fees for card and ACH processing. The Developer API itself has no
  separate per-call cost — usage is governed by the leaky-bucket query-cost throttle documented in
  jobber-rate-limits.yml.
sources:
  - https://getjobber.com/pricing/
  - https://developer.getjobber.com/docs/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Jobber
serviceCategory: Business Application Software
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  primaryUnit: account-month
  secondaryUnits:
    - user-month
    - transaction
focusColumns:
  ServiceName: Jobber
  ServiceCategory: Business Application Software
  ProviderName: Jobber
  PublisherName: Jobber
  InvoiceIssuerName: Jobber
  PricingCategory: Subscription
  PricingUnit: account-month
  BillingCurrency: USD
meters:
  - name: subscription
    unit: account-month
    aggregation: sum
    dimensions:
      - plan
      - billing_term
  - name: additional_user
    unit: user-month
    aggregation: sum
    dimensions:
      - plan
  - name: payments_card_present
    unit: transaction
    aggregation: sum
    dimensions:
      - currency
  - name: payments_card_not_present
    unit: transaction
    aggregation: sum
    dimensions:
      - currency
  - name: payments_ach
    unit: transaction
    aggregation: sum
    dimensions:
      - currency
costAllocation:
  recommendedTags:
    - plan
    - billing_term
    - account_id
    - app_id
notes:
  - Jobber does not currently expose a programmatic Usage / Cost reporting API; cost data is retrieved from billing statements in the Jobber web app.
  - Jobber Payments fees vary by region and processing method; consult the Jobber Payments terms for current rates.
