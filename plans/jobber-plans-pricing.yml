    description: 14 days of full access to Grow plan features — no credit card required.
    durationDays: 14
    plan: jobber-grow
notes:
  - The Jobber Developer API itself is free to use; pricing in this file covers the SaaS subscription required to host the account the API operates against.
  - Payment processing (Jobber Payments) is billed separately via per-transaction fees not enumerated here.
